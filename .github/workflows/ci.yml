name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} · verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      JEV_GUARD_MAX_CALLS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run review:eval -- --responses evals/review/recorded-jev-1.13.0.json
      - run: npm run verify:change-demo
      - run: npm run verify:external
        if: matrix.node == 22
      - run: npm run verify:install
      - run: npm run review:build
      - run: npm run verify:review-install
      - run: npm run plugin:build
      - run: npm run verify:plugin
      - run: node out/plugin/proof-jev/bin/vouch.mjs --doctor
