name: False positive
description: A reported finding that is not a real bug
labels: [false-positive]
body:
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: Source location, mutation patch or review judgment, and the relevant test result.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is not a bug
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: "Selected Git base, test command, and expected behavior. Remove private source and credentials from reports."
