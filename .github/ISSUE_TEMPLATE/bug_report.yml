name: Bug report
description: Something in proof-jev itself does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command or MCP request, selected Git base, and a minimal repository diff. Remove tokens and private source.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The relevant log lines or report finding. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or package version, and Node version.
